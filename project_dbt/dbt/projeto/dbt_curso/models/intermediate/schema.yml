version: 2

models:

  # ==========================================
  # INTERMEDIATE - PEDIDOS + ITENS
  # ==========================================
  
  - name: int_pedidos_itens_pedidos
    description: "Modelo intermediário que combina pedidos e itens de pedidos, trazendo granularidade por item"

    columns:
      - name: id_pedido
        description: "Identificador do pedido"
        tests:
          - not_null

      - name: id_cliente
        description: "Identificador do cliente"
        tests:
          - not_null

      - name: data_pedido
        description: "Data do pedido"

      - name: status
        description: "Status do pedido já padronizado"

      - name: id_produto
        description: "Identificador do produto"
        tests:
          - not_null

      - name: quantidade
        description: "Quantidade de itens no pedido"

      - name: preco_unitario
        description: "Preço unitário do produto"

      - name: desconto
        description: "Valor de desconto aplicado ao item"

      - name: valor_bruto
        description: "Valor bruto do item (quantidade x preço unitário)"

      - name: valor_liquido
        description: "Valor líquido do item após desconto"


  # ==========================================
  # INTERMEDIATE - PEDIDOS AGREGADOS
  # ==========================================
  
  - name: int_pedidos
    description: "Modelo intermediário que agrega os pedidos ao nível de pedido, consolidando valores"

    columns:
      - name: id_pedido
        description: "Identificador único do pedido"
        tests:
          - not_null

      - name: id_cliente
        description: "Identificador do cliente associado ao pedido"
        tests:
          - not_null

      - name: data_pedido
        description: "Data em que o pedido foi realizado"

      - name: status
        description: "Status do pedido"

      - name: valor_bruto_total
        description: "Soma dos valores brutos dos itens do pedido"

      - name: valor_liquido_total
        description: "Soma dos valores líquidos dos itens do pedido"